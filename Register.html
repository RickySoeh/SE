<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
    <link rel="stylesheet" href="CSS/Register.css"> 
</head>

<body>
    <div id="LogoBox">
        <h1 id="Logo">Jenius Academy</h1>
    </div>

    <nav class="NavBar">
        <ul>
            <li><a href="Home.html">Home</a></li>
            <li><a href="Learn.html">Learn</a></li>
            <li><a href="Testimony.html">Testimony</a></li>
            <li><a href="Subscription.html">Subscription</a></li>
        </ul>
    </nav>

    <div id="RegisterOutline">
        <div id="RegisterBox">
            <form action="" id="Registerform">
                <h2 id="RegisterTitle">Register</h2> <br><br>  
                <input type="text" name="firstname" id="firstname" placeholder="First Name" class="form"> <br><br>
                <input type="text" name="surname" id="surname" placeholder="Surname" class="form"> <br> <br>
                <input type="email" name="emails" id="emails" placeholder="Email" class="form"> <br> <br>
                <input type="text" name="phone" id="phone" placeholder="Phone Number" class="form"> <br> <br>
                <input type="password" name="pass1" id="pass1" placeholder="Password" class="form"> <br> <br>
                <input type="password" name="pass2" id="pass2" placeholder="Confirm Password" class="form"> <br> <br>
    
                <p id="error">error</p>
                <input type="Submit" value="Confirm" class="Button"> <br> <br> 
            </form>
        </div>
    </div>

    <footer>
        <div class="footerContent">
            <ul class="Icons">
                <li id="facebook"><a href=""> <img src="Assets/facebook.png" alt="Facebook_Icon"> </a></li>
                <li id="instagram"><a href=""> <img src="Assets/instagram.png" alt="Instagram_Icon"> </a></li>
                <li id="youtube"><a href=""> <img src="Assets/youtube.png" alt="Youtube_Icon"> </a></li>
                <li id="twitter"><a href=""> <img src="Assets/twitter.png" alt="Twitter_Icon"> </a></li>
            </ul>
        </div>
        
        <p id="Privacy">Privacy Policy | Terms of Service</p>
        <p id="Copy">© 2021 Jenius Academy. All rights reserved.</p>
    </footer>

    <script src="JavaScript/Register.js"></script>
</body>
</html>
